
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Spinning Wheel</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #151824;
    color: white;
    text-align: center;
  }
  h1 { margin-top: 30px; }
  .wheel-area {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 35px auto;
  }
  canvas { width: 100%; height: 100%; }
  .pointer {
    position: absolute;
    top: -15px;
    left: calc(50% - 15px);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid white;
    z-index: 2;
  }
  button {
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    margin: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; }
  #settings {
    max-width: 450px;
    margin: 24px auto;
    padding: 18px;
    background: #252a3b;
    border-radius: 12px;
  }
  .option {
    display: flex;
    gap: 10px;
    margin: 8px 0;
  }
  input {
    padding: 8px;
    width: 45%;
    border-radius: 5px;
    border: none;
  }
  #result { font-size: 24px; font-weight: bold; }
</style>
</head>
<body>

<h1>Spin the Wheel!</h1>

<div class="wheel-area">
  <div class="pointer"></div>
  <canvas id="wheel" width="400" height="400"></canvas>
</div>

<button id="spinBtn" onclick="spin()">SPIN!</button>
<button onclick="toggleSettings()">Settings</button>

<p id="result"></p>

<div id="settings">
  <h2>Wheel Settings</h2>
  <p>Adjust the weight of each option.</p>
  <div id="options"></div>
  <button onclick="addOption()">Add Option</button>
  <button onclick="saveSettings()">Save Changes</button>
</div>

<script>
let items = [
  { name: "Prize A", weight: 60 },
  { name: "Prize B", weight: 25 },
  { name: "Prize C", weight: 10 },
  { name: "Prize D", weight: 5 }
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const colors = ["#5865f2", "#ed6678", "#f5ba45", "#3cc5ac"];
let rotation = 0;
let spinning = false;

function drawWheel() {
  const n = items.length;
  const arc = Math.PI * 2 / n;
  ctx.clearRect(0, 0, 400, 400);

  items.forEach((item, i) => {
    const start = rotation + i * arc;
    ctx.beginPath();
    ctx.moveTo(200, 200);
    ctx.arc(200, 200, 190, start, start + arc);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(200, 200);
    ctx.rotate(start + arc / 2);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 17px Arial";
    ctx.textAlign = "right";
    ctx.fillText(item.name, 175, 6, 155);
    ctx.restore();
  });
}

function renderSettings() {
  const container = document.getElementById("options");
  container.replaceChildren();
  items.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "option";
    row.innerHTML =
      `<input aria-label="Option name" id="name${i}">
       <input aria-label="Weight" id="weight${i}" type="number" min="0">`;
    container.appendChild(row);
    document.getElementById(`name${i}`).value = item.name;
    document.getElementById(`weight${i}`).value = item.weight;
  });
}

function saveSettings() {
  const updated = items.map((_, i) => ({
    name: document.getElementById(`name${i}`).value.trim(),
    weight: Number(document.getElementById(`weight${i}`).value)
  }));
  if (updated.some(x => !x.name || !Number.isFinite(x.weight) || x.weight < 0)
      || !updated.some(x => x.weight > 0)) {
    alert("Enter names and valid weights, with at least one above zero.");
    return;
  }
  items = updated;
  drawWheel();
  renderSettings();
}

function addOption() {
  items.push({ name: "New Option", weight: 10 });
  renderSettings();
}

function toggleSettings() {
  const panel = document.getElementById("settings");
  panel.hidden = !panel.hidden;
}

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("result").textContent = "";

  const total = items.reduce((sum, item) => sum + item.weight, 0);
  let random = Math.random() * total;
  let winner = items.length - 1;
  for (let i = 0; i < items.length; i++) {
    random -= items[i].weight;
    if (random < 0) {
      winner = i;
      break;
    }
  }

  const arc = 2 * Math.PI / items.length;
  const pointerAngle = -Math.PI / 2;
  const desired = pointerAngle - (winner + 0.5) * arc;
  const turns = 2 * Math.PI;
  const delta = ((desired - rotation) % turns + turns) % turns;
  const from = rotation;
  const to = from + 6 * turns + delta;
  const duration = 4500;
  const startTime = performance.now();

  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 4);
    rotation = from + (to - from) * eased;
    drawWheel();

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      document.getElementById("spinBtn").disabled = false;
      document.getElementById("result").textContent =
        "Winner: " + items[winner].name;
    }
  }
  requestAnimationFrame(animate);
}

renderSettings();
drawWheel();
</script>
</body>
</html>
